<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Spring Boot Todo App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <style>
      /* Koyu mod (Dark Mode) desteği için Bootstrap 5.3 data-bs-theme kullanır */
      [data-bs-theme="dark"] .text-primary {
        color: #6ea8fe !important; /* Bootstrap dark blue */
      }
    </style>
    <body>
      <div class="container mt-4">
        <div class="row g-3">
          <!-- Event Loop -->
          <div class="col-md-6 col-lg-4" th:each="event : ${events}">
            <div class="card shadow-sm h-100 border-0">
              <!-- Header -->
              <div
                class="card-header d-flex justify-content-between align-items-center"
                th:classappend="${event.important} ? 'bg-warning-subtle' : 'bg-light'"
              >
                <span>
                  <i class="fa-solid fa-calendar-day"></i>
                  <span
                    th:text="${#temporals.format(event.createdAt, 'HH:mm')}"
                  ></span>
                </span>

                <!-- Important Icon -->
                <i
                  class="fa-solid fa-star text-warning"
                  th:if="${event.important}"
                ></i>
              </div>

              <!-- Body -->
              <div class="card-body">
                <!-- Title -->
                <h5 class="card-title" th:text="${event.title}"></h5>

                <!-- Description -->
                <p
                  class="card-text text-muted"
                  th:text="${event.description}"
                ></p>

                <!-- URL -->
                <a
                  th:if="${event.url != null}"
                  th:href="${event.url}"
                  target="_blank"
                  class="btn btn-sm btn-outline-primary"
                >
                  <i class="fa-solid fa-link"></i> Git
                </a>
              </div>

              <!-- Footer -->
              <div
                class="card-footer d-flex justify-content-between align-items-center"
              >
                <!-- Status -->
                <span>
                  <i
                    class="fa-solid fa-ban text-danger"
                    th:if="${event.canceled}"
                  ></i>

                  <span th:if="${event.canceled}" class="text-danger">
                    İptal
                  </span>

                  <span th:if="${!event.canceled}" class="text-success">
                    Aktif
                  </span>
                </span>

                <!-- Actions -->
                <div>
                  <a
                    th:href="@{/event/important/{id}(id=${event.id})}"
                    class="btn btn-sm btn-outline-secondary"
                  >
                    <i class="fa-solid fa-pen"></i>
                  </a>

                  <a
                    th:href="@{/event/cancel/{id}(id=${event.id})}"
                    class="btn btn-sm btn-outline-secondary"
                  >
                    <i class="fa-solid fa-circle-xmark"></i>
                  </a>

                  <a
                    th:href="@{/event/delete/{id}(id=${event.id})}"
                    class="btn btn-sm btn-outline-danger"
                  >
                    <i class="fa-solid fa-trash"></i>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="container mt-5">
        <div class="card shadow-lg">
          <div class="card-header bg-primary text-white">
            <h4><i class="fa-solid fa-calendar-plus"></i> Yeni Event Ekle</h4>
          </div>
          <div class="card-body">
            <form th:action="@{/event/add}" th:object="${event}" method="post">
             <input type="hidden" th:field="*{createdAt}" />
             <input type="hidden" th:field="*{calendarId}" />
              <!-- Title -->
              <div class="mb-3">
                <label class="form-label">
                  <i class="fa-solid fa-heading"></i> Başlık
                </label>
                <input
                  type="text"
                  class="form-control"
                  th:field="*{title}"
                  placeholder="Event başlığı"
                />
              </div>

              <!-- Description -->
              <div class="mb-3">
                <label class="form-label">
                  <i class="fa-solid fa-align-left"></i> Açıklama
                </label>
                <textarea
                  class="form-control"
                  th:field="*{description}"
                  rows="3"
                ></textarea>
              </div>

              <!-- Saat ve Dakika -->
              <div class="row mb-3">
                <!-- Saat -->
                <div class="col">
                  <label class="form-label">
                    <i class="fa-solid fa-clock"></i> Saat
                  </label>
                  <select class="form-select" name="hour">
                    <option
                      th:each="h : ${#numbers.sequence(0,23)}"
                      th:value="${h}"
                      th:text="${h}"
                    ></option>
                  </select>
                </div>

                <!-- Dakika -->
                <div class="col">
                  <label class="form-label">
                    <i class="fa-solid fa-stopwatch"></i> Dakika
                  </label>
                  <select class="form-select" name="minute">
                    <option
                      th:each="m : ${#numbers.sequence(0,59)}"
                      th:value="${m}"
                      th:text="${m}"
                    ></option>
                  </select>
                </div>
              </div>

              <!-- URL -->
              <div class="mb-3">
                <label class="form-label">
                  <i class="fa-solid fa-link"></i> URL
                </label>
                <input
                  type="text"
                  class="form-control"
                  th:field="*{url}"
                  placeholder="https://..."
                />
              </div>

              <!-- Important -->
              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  th:field="*{important}"
                />
                <label class="form-check-label">
                  <i class="fa-solid fa-star text-warning"></i> Önemli
                </label>
              </div>

              <!-- Canceled -->
              <div class="form-check mb-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  th:field="*{canceled}"
                />
                <label class="form-check-label">
                  <i class="fa-solid fa-ban text-danger"></i> İptal Edildi
                </label>
              </div>

              <!-- Submit -->
              <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-success">
                  <i class="fa-solid fa-save"></i> Kaydet
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </body>
  </head>
</html>
